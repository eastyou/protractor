[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protractor"
version = "0.1.0"
description = "量角器：0–180° 半圆量角器、内外圈读数、读角画角练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "math", "geometry", "angle", "protractor", "worksheet", "printable", "svg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
protractor = "protractor.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/protractor"
Source = "https://github.com/eastyou/protractor"

[tool.setuptools]
packages = ["protractor"]
